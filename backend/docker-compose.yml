services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-normvis}
      POSTGRES_USER: ${DB_USER:-normvis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-normvis_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - normvis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-normvis} -d ${DB_NAME:-normvis}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  normvis_postgres_data:
